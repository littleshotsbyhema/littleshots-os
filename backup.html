<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your files · Little Shots</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23c2557a'/><text y='68' x='50' text-anchor='middle' font-size='46' font-family='sans-serif' font-weight='bold' fill='white'>LS</text></svg>">
<style>
  :root{
    --rose:#c2557a; --rose-d:#a8456a; --ink:#2b2126; --ink-soft:#8a7d84;
    --bg:#faf7f8; --line:#ebe2e6; --green:#3f8f5f; --amber:#b07d1a; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px}
  .wrap{max-width:660px;margin:0 auto;padding:22px 16px 0}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--rose);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  h1{font-size:21px;margin:14px 0 2px;letter-spacing:-.2px}
  .sub{color:var(--ink-soft);margin:0 0 18px;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}
  .note{border-radius:11px;padding:11px 13px;font-size:13.5px;margin-bottom:13px}
  .note.amber{background:#fdf6e6;border:1px solid #f0dfb4;color:var(--amber)}
  .note.red{background:#fdeeec;border:1px solid #f4cfca;color:var(--red)}
  .note.green{background:#eef7f1;border:1px solid #cfe6d8;color:var(--green)}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);min-height:150px;resize:vertical;
    line-height:1.7}
  textarea:focus{outline:none;border-color:var(--rose)}
  input.one{width:100%;font:inherit;font-size:16px;padding:11px 12px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input.one:focus{outline:none;border-color:var(--rose)}
  .btn{font:inherit;font-size:14px;font-weight:650;padding:10px 15px;border-radius:10px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .btn.p{background:var(--rose);border-color:var(--rose);color:#fff}
  .btn.p:hover{background:var(--rose-d)}
  .btn.big{width:100%;padding:14px;font-size:15px;margin-bottom:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.p:disabled:hover{background:var(--rose)}
  .gallery{display:block;text-align:center;padding:13px;border-radius:11px;background:var(--rose);
    color:#fff;font-weight:700;text-decoration:none;margin-bottom:14px}
  .gallery:hover{background:var(--rose-d)}
  .steps{margin:0 0 16px;padding-left:19px;color:var(--ink-soft);font-size:13.5px}
  .steps li{margin-bottom:4px}
  .hint{color:var(--ink-soft);font-size:12.5px;margin:9px 0 0}
  .foot{text-align:center;color:var(--ink-soft);font-size:12px;padding:22px 0 30px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="card"><div style="padding:22px;text-align:center;color:#8a7d84">Loading…</div></div>
</div>

<script>
/* The client telling us they have their own copy. Nothing here deletes
   anything - it only flags the job so the studio can clear the drive. */
const SB  = "https://bdadnmwauyarukqvfbvd.supabase.co";
const KEY = "sb_publishable_xnepieuyFIwBqGwtwMJ7Sg_FovsaMNe";
const TOKEN = new URLSearchParams(location.search).get("t") || "";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* the token is the credential, so these go straight to the database */
async function rpc(fn, body) {
  const r = await fetch(SB + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY },
    body: JSON.stringify(body)
  });
  return r.json();
}

const niceDate = s => {
  if (!s) return "";
  const d = new Date(s + "T00:00:00");
  return isNaN(d) ? s : d.toLocaleDateString(undefined,
    { day: "numeric", month: "long", year: "numeric" });
};

function stop(title, body, tone) {
  $("root").innerHTML = `<div class="logo">LS</div><h1>${esc(title)}</h1>
    <div class="card"><div class="note ${tone || "red"}" style="margin:0">${body}</div></div>
    <p class="foot">Little Shots by Hema</p>`;
}

async function boot() {
  if (!TOKEN) return stop("Something is missing",
    "This link is incomplete. Please ask the studio to send it again.");
  let d;
  try { d = await rpc("retention_view", { p_token: TOKEN }); }
  catch (e) { return stop("We couldn't reach the studio",
    "Please check your connection and open the link again."); }
  if (!d || d.error) return stop("This link isn't working", esc((d && d.error) ||
    "Please ask the studio for a new one."));

  if (d.deleted) return stop("Already cleared",
    "These files have been removed from our backup. We hope you have your own copy " +
    "safely stored.", "green");

  paint(d);
}

function paint(d) {
  const left = Number(d.days_left);
  const done = !!d.confirmed_at;
  $("root").innerHTML = `
    <div class="logo">LS</div>
    <h1>${esc(d.client_name)}</h1>
    <p class="sub">${esc(d.shoot_type)} · your photographs</p>

    ${done ? `<div class="note green">Thank you — you have told us your backup is
      taken. We will clear our copy shortly. There is nothing more to do.</div>`
    : `<div class="note amber">We keep your unedited and edited files for
      <b>${esc(d.days)} days</b> after your order is ready. After
      <b>${esc(niceDate(d.due_on))}</b>${left > 0
        ? ` — that is <b>${left} day${left === 1 ? "" : "s"}</b> away —` : ""}
      they are removed from our storage for good.</div>`}

    <div class="card">
      <p style="margin:0 0 4px"><b>Please take your own backup.</b></p>
      <ol class="steps">
        <li>Download everything from the gallery links we sent you.</li>
        <li>Keep a copy somewhere safe — a laptop, an external drive, or cloud storage.</li>
        <li>Once it is safely stored, let us know below.</li>
      </ol>
      <p class="hint">We cannot recover these once they are gone, so do keep your own copy
        even if you never use this button.</p>
    </div>

    ${done ? "" : `<div class="card">
      <button class="btn p big" id="yes" onclick="confirmBackup()">
        I have my backup — you can delete your copy</button>
      <p class="hint">This only tells the studio it is safe to clear their drive.
        It does not delete anything you have downloaded.</p>
      <div id="msg"></div>
    </div>`}
    <p class="foot">Little Shots by Hema</p>`;
}

async function confirmBackup() {
  const b = $("yes");
  const was = b.textContent;
  b.disabled = true; b.textContent = "Saving…";
  const r = await rpc("retention_confirm", { p_token: TOKEN });
  if (!r || r.error) {
    b.disabled = false; b.textContent = was;
    return bad((r && r.error) || "That didn't go through. Please try again.");
  }
  stop("Thank you", "We have noted that your backup is taken, and we will clear our " +
    "copy shortly. Do keep yours safe — we will not be able to send these again.", "green");
}

function bad(text) {
  const host = $("msg");
  if (host) host.innerHTML = `<div class="note red" style="margin:11px 0 0">${esc(text)}</div>`;
}

boot();
</script>
</body>
</html>
