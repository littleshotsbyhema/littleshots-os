<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your approval · Little Shots</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23c2557a'/><text y='68' x='50' text-anchor='middle' font-size='46' font-family='sans-serif' font-weight='bold' fill='white'>LS</text></svg>">
<style>
  :root{
    --rose:#c2557a; --rose-d:#a8456a; --ink:#2b2126; --ink-soft:#8a7d84;
    --bg:#faf7f8; --line:#ebe2e6; --green:#3f8f5f; --amber:#b07d1a; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px}
  .wrap{max-width:660px;margin:0 auto;padding:22px 16px 0}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--rose);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  h1{font-size:21px;margin:14px 0 2px;letter-spacing:-.2px}
  .sub{color:var(--ink-soft);margin:0 0 18px;font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}
  .note{border-radius:11px;padding:11px 13px;font-size:13.5px;margin-bottom:13px}
  .note.amber{background:#fdf6e6;border:1px solid #f0dfb4;color:var(--amber)}
  .note.red{background:#fdeeec;border:1px solid #f4cfca;color:var(--red)}
  .note.green{background:#eef7f1;border:1px solid #cfe6d8;color:var(--green)}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
  textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);min-height:150px;resize:vertical;
    line-height:1.7}
  textarea:focus{outline:none;border-color:var(--rose)}
  input.one{width:100%;font:inherit;font-size:16px;padding:11px 12px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input.one:focus{outline:none;border-color:var(--rose)}
  .btn{font:inherit;font-size:14px;font-weight:650;padding:10px 15px;border-radius:10px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .btn.p{background:var(--rose);border-color:var(--rose);color:#fff}
  .btn.p:hover{background:var(--rose-d)}
  .btn.big{width:100%;padding:14px;font-size:15px;margin-bottom:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.p:disabled:hover{background:var(--rose)}
  .gallery{display:block;text-align:center;padding:13px;border-radius:11px;background:var(--rose);
    color:#fff;font-weight:700;text-decoration:none;margin-bottom:14px}
  .gallery:hover{background:var(--rose-d)}
  .steps{margin:0 0 16px;padding-left:19px;color:var(--ink-soft);font-size:13.5px}
  .steps li{margin-bottom:4px}
  .hint{color:var(--ink-soft);font-size:12.5px;margin:9px 0 0}
  .foot{text-align:center;color:var(--ink-soft);font-size:12px;padding:22px 0 30px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="card"><div style="padding:22px;text-align:center;color:#8a7d84">Loading…</div></div>
</div>

<script>
const SB  = "https://bdadnmwauyarukqvfbvd.supabase.co";
const KEY = "sb_publishable_xnepieuyFIwBqGwtwMJ7Sg_FovsaMNe";
const TOKEN = new URLSearchParams(location.search).get("t") || "";

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function call(fn, body) {
  const r = await fetch(SB + "/functions/v1/" + fn, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY },
    body: JSON.stringify(body)
  });
  return r.json();
}

function stop(title, body, tone) {
  $("root").innerHTML = `<div class="logo">LS</div><h1>${esc(title)}</h1>
    <div class="card"><div class="note ${tone || "red"}" style="margin:0">${body}</div></div>
    <p class="foot">Little Shots by Hema</p>`;
}

async function boot() {
  if (!TOKEN) return stop("Something is missing",
    "This link is incomplete. Please ask the studio to send it again.");
  let d;
  try { d = await call("approval-get", { token: TOKEN }); }
  catch (e) { return stop("We couldn't reach the studio",
    "Please check your connection and open the link again."); }
  if (!d || d.error) return stop("This link isn't working", esc((d && d.error) ||
    "Please ask the studio for a new one."));

  if (d.kind === "album") return paintAlbum(d);
  paintEdits(d);
}

/* The edited photos. One question only: are you happy with them — plus, if
   they have prints coming, which photo goes on each. Asked here because this
   is the one moment they are actually looking at the photos. */
function paintEdits(d) {
  const n = Number(d.photos_edited) || 0;
  const wantFrame = !!d.needs_frame, wantCover = !!d.needs_cover;
  const picks = [];
  if (wantCover) picks.push(`
    <label class="f" for="cover">Which photo for your album cover?${
      d.album_size ? ` <span style="font-weight:600;text-transform:none">(${esc(d.album_size)} album)</span>` : ""}</label>
    <input id="cover" class="one" inputmode="text" autocapitalize="off" autocomplete="off"
      spellcheck="false" placeholder="e.g. IMG_1234"
      value="${esc(d.album_cover_file || "")}">`);
  if (wantFrame) picks.push(`
    <label class="f" for="frame" style="margin-top:13px">Which photo for your frame?${
      d.frame_size ? ` <span style="font-weight:600;text-transform:none">(${esc(d.frame_size)} frame)</span>` : ""}</label>
    <input id="frame" class="one" inputmode="text" autocapitalize="off" autocomplete="off"
      spellcheck="false" placeholder="e.g. IMG_1234"
      value="${esc(d.frame_file || "")}">`);

  $("root").innerHTML = `
    <div class="logo">LS</div>
    <h1>${esc(d.client_name)}</h1>
    <p class="sub">${esc(d.shoot_type)}${n
      ? ` · <b>${n}</b> edited photo${n === 1 ? "" : "s"}` : ""}</p>

    ${d.link ? `<a class="gallery" href="${esc(d.link)}"
      target="_blank" rel="noreferrer noopener">Open your edited photos ↗</a>` : ""}

    <ol class="steps">
      <li>Open the link and look through your edited photos.</li>
      <li>Download anything you'd like to keep.</li>
      ${picks.length ? `<li>Tell us which photo you'd like printed.</li>` : ""}
      <li>Let us know you're happy with them.</li>
    </ol>

    ${picks.length ? `<div class="card">
      ${picks.join("")}
      <p class="hint">The file name is written under each photo in the gallery.
        These get printed, so it's worth double-checking.</p>
    </div>` : ""}

    <div class="card">
      <button class="btn p big" id="yes" onclick="decide('approve')">
        Yes, I'm happy with these</button>
      <p class="hint">If something doesn't look right, just reply to the studio's
        email and we'll sort it out.</p>
      <div id="msg"></div>
    </div>
    <p class="foot">Little Shots by Hema</p>`;
}

/* The album design. Approve sends it to print, so the alternative has to be
   just as easy to reach - otherwise corrections arrive by phone at 11pm. */
function paintAlbum(d) {
  const spec = [d.album_size, d.album_sheets ? d.album_sheets + " sheets" : ""]
    .filter(Boolean).join(" · ");
  $("root").innerHTML = `
    <div class="logo">LS</div>
    <h1>${esc(d.client_name)}</h1>
    <p class="sub">Album design${spec ? " · " + esc(spec) : ""}${
      Number(d.revision) > 0 ? ` · revision ${Number(d.revision) + 1}` : ""}</p>

    ${d.link ? `<a class="gallery" href="${esc(d.link)}"
      target="_blank" rel="noreferrer noopener">Open your album design ↗</a>` : ""}

    <div class="note amber">Once you approve it, the album goes to print as it is —
      so do have a careful look at the names, dates and spellings first.</div>

    <div class="card">
      <button class="btn p big" id="yes" onclick="decide('approve')">
        Approve and send to print</button>
      <button class="btn big" id="no" onclick="openFix()">Something needs changing</button>
      <div id="fix" style="display:none;margin-top:6px">
        <label class="f" for="notes">What should we correct?</label>
        <textarea id="notes" placeholder="Page 4 — my name is spelled Sagithya, not Sagitya&#10;Page 11 — please use the photo from the garden instead"></textarea>
        <p class="hint">Be as specific as you can — page numbers help a lot.</p>
        <button class="btn p" id="sendFix" style="margin-top:11px"
          onclick="decide('reject')">Send these corrections</button>
      </div>
      <div id="msg"></div>
    </div>
    <p class="foot">Little Shots by Hema</p>`;
}

function openFix() {
  $("fix").style.display = "block";
  $("no").style.display = "none";
  $("yes").style.display = "none";
  $("notes").focus();
}

async function decide(decision) {
  const notesEl = $("notes");
  const notes = notesEl ? notesEl.value.trim() : null;
  if (decision === "reject" && !notes) {
    return bad("Please tell us what needs correcting.");
  }
  /* these get printed, so do not let them past empty */
  const coverEl = $("cover"), frameEl = $("frame");
  const cover = coverEl ? coverEl.value.trim() : null;
  const frame = frameEl ? frameEl.value.trim() : null;
  if (coverEl && !cover) {
    coverEl.focus();
    return bad("Please tell us which photo you'd like on your album cover.");
  }
  if (frameEl && !frame) {
    frameEl.focus();
    return bad("Please tell us which photo you'd like in your frame.");
  }
  const b = decision === "reject" ? $("sendFix") : $("yes");
  const was = b.textContent;
  b.disabled = true; b.textContent = "Sending…";

  const r = await call("approval-submit", { token: TOKEN, decision, notes, frame, cover });
  if (!r || r.error) {
    b.disabled = false; b.textContent = was;
    return bad((r && r.error) || "That didn't go through. Please try again.");
  }

  if (r.kind === "edits") {
    return stop("Thank you", "We're glad you like them. Your photos are all yours now — " +
      "do share them with us if you post any.", "green");
  }
  if (r.decision === "approve") {
    return stop("Thank you — off to print",
      "Your album is on its way to the press. We'll let you know the moment " +
      "it's ready to collect.", "green");
  }
  stop("Thank you — we're on it",
    "Your corrections are with the design team. We'll send the album back to " +
    "you for another look once they're done.", "green");
}

function bad(text) {
  const host = $("msg");
  if (host) host.innerHTML = `<div class="note red" style="margin:11px 0 0">${esc(text)}</div>`;
}

boot();
</script>
</body>
</html>
